{% extends "base.html" %} {% block content %}
<div class="max-w-sm mx-auto mt-16">
  <div class="auth-card">
    <h1>Entrar</h1>
    <form method="post" action="{% url 'account_login' %}" class="auth-form">
      {% csrf_token %} {% if form.non_field_errors %}
      <div class="form-error">{{ form.non_field_errors.0 }}</div>
      {% endif %} {% for field in form %}
      <div class="control-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }} {% if field.errors %}
        <span class="form-error">{{ field.errors.0 }}</span>
        {% endif %}
      </div>
      {% endfor %}
      <button
        type="submit"
        class="btn btn-primary"
        style="width: 100%; justify-content: center"
      >
        Entrar
      </button>
    </form>
    <a href="{% url 'account_signup' %}" class="auth-alt-link">Criar conta</a>
  </div>
</div>
{% endblock %}
