<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imóveis Tubarão — Agregador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div>
        <div class="header-title">Imóveis <span>Tubarão</span></div>
        <div class="header-sub" style="margin-top: 6px">
          Agregador de imóveis · SC
        </div>
      </div>
    </header>

    <div class="controls" id="controls">
      <div class="controls-section">
        <div class="control-group">
          <label>Negócio</label>
          <select id="filter-business" style="min-width: 110px">
            <option value="venda" selected>Venda</option>
            <option value="aluguel">Aluguel</option>
          </select>
        </div>
        <div class="control-group">
          <label>Tipo (Segure CTRL para vários)</label>
          <select
            id="filter-types"
            multiple
            style="height: 60px; min-width: 140px; padding: 4px"
          >
            <option value="apartamento" selected>Apartamento</option>
            <option value="casa">Casa</option>
            <option value="terreno">Terreno</option>
            <option value="loft">Loft / Studio</option>
            <option value="comercial">Sala Comercial</option>
          </select>
        </div>
      </div>
      <div class="controls-divider"></div>

      <div class="controls-section">
        <div class="control-group">
          <label>Cidade</label>
          <select id="filter-city" style="min-width: 140px">
            <option value="">Todas as Cidades</option>
            <option value="Tubarão" selected>Tubarão</option>
            <option value="Capivari de Baixo">Capivari de Baixo</option>
            <option value="Laguna">Laguna</option>
            <option value="Jaguaruna">Jaguaruna</option>
          </select>
        </div>
        <div class="control-group">
          <label>Bairro</label>
          <select id="filter-neighborhood" style="min-width: 150px">
            <option value="">Todos os bairros</option>
          </select>
        </div>
      </div>

      <div class="controls-divider"></div>

      <div class="controls-section">
        <div class="control-group">
          <label>Preço mín.</label>
          <input
            id="filter-min-price"
            type="number"
            placeholder="0"
            style="min-width: 110px"
          />
        </div>
        <div class="control-group">
          <label>Preço máx.</label>
          <input
            id="filter-max-price"
            type="number"
            placeholder="320000"
            value="320000"
            style="min-width: 110px"
          />
        </div>
      </div>

      <div class="controls-divider"></div>

      <div class="controls-section">
        <div class="control-group">
          <label>Quartos mín.</label>
          <select id="filter-bedrooms">
            <option value="">Todos</option>
            <option value="1" selected>1+</option>
            <option value="2">2+</option>
            <option value="3">3+</option>
            <option value="4">4+</option>
          </select>
        </div>
        <div class="control-group">
          <label>Banheiros mín.</label>
          <select id="filter-bathrooms">
            <option value="">Todos</option>
            <option value="1" selected>1+</option>
            <option value="2">2+</option>
            <option value="3">3+</option>
          </select>
        </div>
        <div class="control-group">
          <label>Vagas mín.</label>
          <select id="filter-parking">
            <option value="">Todos</option>
            <option value="1" selected>1+</option>
            <option value="2">2+</option>
          </select>
        </div>
      </div>

      <div class="controls-divider"></div>

      <div class="controls-section">
        <div class="control-group">
          <label>Área mín. (m²)</label>
          <input
            id="filter-min-area"
            type="number"
            placeholder="50"
            value="50"
            style="min-width: 90px"
          />
        </div>
        <div class="control-group">
          <label>Área máx. (m²)</label>
          <input
            id="filter-max-area"
            type="number"
            placeholder="Sem limite"
            style="min-width: 90px"
          />
        </div>
      </div>

      <div class="controls-right">
        <button class="btn btn-ghost" id="btn-clear">Limpar</button>
        <button class="btn btn-primary" id="btn-search">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          Buscar
        </button>
      </div>
    </div>

    <div class="filter-summary" id="filter-summary" style="display: none"></div>

    <div class="status-bar" id="status-bar">
      <div>
        <span id="status-text">Clique em Buscar para carregar imóveis.</span>
        <span id="status-api" style="font-size: 0.72rem; margin-left: 10px"
          >API: <code>https://imobiliarias.pepefcardoso.dev</code></span
        >
      </div>
      <div class="view-toggle">
        <button
          id="btn-view-table"
          class="btn btn-ghost active"
          style="height: 30px; font-size: 0.75rem"
        >
          Tabela
        </button>
        <button
          id="btn-view-map"
          class="btn btn-ghost"
          style="height: 30px; font-size: 0.75rem"
        >
          Mapa
        </button>
      </div>
    </div>

    <div id="view-table-section">
      <div class="table-wrap">
        <div id="table-container"></div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>

    <div id="view-map-section" style="display: none; padding: 0 2.5rem 2rem">
      <div
        id="map-container"
        style="width: 100%; height: 65vh; border-radius: 8px; z-index: 1"
      ></div>
      <div style="font-size: 0.75rem; color: var(--ink-muted); margin-top: 8px">
        * Os imóveis são localizados progressivamente para não sobrecarregar os
        servidores do mapa.
      </div>
    </div>

    <div id="error-area"></div>
    <div class="table-wrap">
      <div id="table-container"></div>
    </div>
    <div class="pagination" id="pagination"></div>

    <div id="image-modal" class="modal">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <img class="modal-content" id="modal-img" />
    </div>

    <div id="sources-modal" class="modal">
      <div
        class="modal-content"
        style="
          background: var(--surface);
          padding: 1.5rem;
          border-radius: 8px;
          width: 90%;
          max-width: 450px;
        "
      >
        <span
          class="modal-close"
          style="top: 15px; right: 20px; color: var(--ink)"
          onclick="closeSourcesModal()"
          >&times;</span
        >
        <h3 style="margin-bottom: 1rem; font-family: 'Playfair Display', serif">
          Anunciado em:
        </h3>
        <div
          id="sources-list"
          style="
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            max-height: 60vh;
            overflow-y: auto;
          "
        ></div>
      </div>
    </div>

    <script src="script.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  </body>
</html>
