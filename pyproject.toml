[project]
name = "imobiliarias"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.17",
    "django-allauth==65.19.2",
    "django-htmx==1.19.0",
    "django-redis==5.4.0",
    "psycopg[binary]==3.2.3",
    "whitenoise==6.7.0",
    "gunicorn==21.2.0",
    "requests==2.31.0",
    "playwright==1.42.0",
    "beautifulsoup4==4.12.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-django==4.9.0",
    "ruff==0.7.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "webapp.settings.dev"