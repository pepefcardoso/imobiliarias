version: "3.8"

services:
  imobiliarias:
    build: .
    container_name: imobiliarias-api
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik-public
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imobiliarias.rule=Host(`imobiliarias.pepefcardoso.dev`)"
      - "traefik.http.routers.imobiliarias.entrypoints=websecure"
      - "traefik.http.routers.imobiliarias.tls.certresolver=letsencrypt"
      - "traefik.http.routers.imobiliarias.middlewares=security-headers@file,imobiliarias-ratelimit"
      - "traefik.http.services.imobiliarias.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.imobiliarias-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.imobiliarias-ratelimit.ratelimit.burst=100"

networks:
  traefik-public:
    external: true
