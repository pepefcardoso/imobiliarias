version: "3.8"

services:
  imobiliarias:
    build: .
    container_name: imobiliarias-api
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik-public
      - internal
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imobiliarias.rule=Host(`imobiliarias.pepefcardoso.dev`)"
      - "traefik.http.routers.imobiliarias.entrypoints=websecure"
      - "traefik.http.routers.imobiliarias.tls.certresolver=letsencrypt"
      - "traefik.http.routers.imobiliarias.middlewares=security-headers@file,imobiliarias-ratelimit"
      - "traefik.http.services.imobiliarias.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.imobiliarias-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.imobiliarias-ratelimit.ratelimit.burst=100"

  postgres:
    image: postgres:16-alpine
    container_name: imobiliarias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: imobiliarias-redis
    restart: unless-stopped
    networks:
      - internal

networks:
  traefik-public:
    external: true
  internal:

volumes:
  postgres-data:
